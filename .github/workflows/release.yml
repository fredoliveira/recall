# Builds and publishes the CLI tarballs/zip for a `v*` tag. The desktop .dmg is built by
# the separate release-desktop.yml workflow (same tag trigger), which attaches its asset
# to this same release - so a bundling failure never blocks the CLI release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: nothing is built or published unless the tag matches the manifest versions and
  # the test suite passes on the tagged commit.
  verify:
    name: verify (version + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the manifest versions
        if: startsWith(github.ref, 'refs/tags/')
        run: sh tools/check_release_version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-targets

  build:
    name: ${{ matrix.target }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p recall

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/recall
          tar -czf recall-${{ matrix.target }}.tar.gz -C "$(dirname "$bin")" recall

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          $bin = "target/${{ matrix.target }}/release/recall.exe"
          Compress-Archive -Path $bin -DestinationPath "recall-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: recall-${{ matrix.target }}
          path: recall-${{ matrix.target }}.*

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Push the formula bump to fredoliveira/homebrew-tap. Needs a TAP_PUSH_TOKEN secret
  # (fine-grained PAT with contents:write on the tap repo); skips quietly if unset.
  tap:
    name: Bump Homebrew formula
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate formula and push to the tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN secret not set; skipping tap bump"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha() { shasum -a 256 "dist/$1" | cut -d' ' -f1; }
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/fredoliveira/homebrew-tap.git" tap
          sh packaging/homebrew/generate.sh formula "$version" \
            "$(sha recall-aarch64-apple-darwin.tar.gz)" \
            "$(sha recall-x86_64-apple-darwin.tar.gz)" \
            "$(sha recall-x86_64-unknown-linux-gnu.tar.gz)" \
            > tap/Formula/recall.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/recall.rb
          git commit -m "recall ${version}"
          # The desktop workflow may push its cask bump concurrently; rebase and retry.
          for _ in 1 2 3; do git push && break; git pull --rebase; done
