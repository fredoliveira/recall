# Builds, signs and notarizes the macOS universal desktop .dmg for a `v*` tag and attaches it to the same
# GitHub release that release.yml publishes the CLI tarballs to. Kept as a separate
# workflow so a Tauri/bundling failure never blocks the CLI release, and so the .dmg
# can be rebuilt on its own via workflow_dispatch.
#
# Both workflows use softprops/action-gh-release, which creates the tag's release if it
# doesn't exist yet and appends assets if it does - so the two runs can finish in either
# order. Only release.yml generates the release notes.
name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: desktop bundle (macos universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Tests gate the CLI release (release.yml); this workflow only re-checks the version,
      # since Tauri stamps tauri.conf.json's into the bundle.
      - name: Check the tag matches the manifest versions
        if: startsWith(github.ref, 'refs/tags/')
        run: sh tools/check_release_version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Signing + notarization need six repo secrets (packaging/homebrew/README.md lists them).
      # A tagged release refuses to ship without them; a manual run without them (a fork,
      # say) still builds, unsigned, with a warning.
      - name: Check signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            # notarytool wants the API key as a file.
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Refusing to release an unsigned app. Missing secrets:$missing"
            exit 1
          else
            echo "::warning::Building UNSIGNED (not notarized). Missing secrets:$missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # With these variables present Tauri's bundler imports the certificate into a
      # temporary keychain, signs the app (hardened runtime) and the .dmg, submits the app
      # to Apple's notary service, waits, and staples the ticket. It treats a variable that
      # is set but empty as set, hence the unset for the unsigned path.
      - name: Build universal .dmg
        working-directory: crates/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          cargo tauri build --target universal-apple-darwin --bundles dmg -- --locked

      - name: Stage .dmg under a stable name
        run: |
          dmg="$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)"
          test -n "$dmg" || { echo "no .dmg produced"; exit 1; }
          mkdir -p dist
          cp "$dmg" "dist/Recall-universal.dmg"

      # Tauri notarizes the app inside the .dmg but not the disk image itself. Do that too,
      # so the download opens cleanly. Stapling changes the file, so this runs before the
      # upload: the cask's sha256 is taken from the artifact.
      - name: Notarize and staple the .dmg
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          xcrun notarytool submit dist/Recall-universal.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait
          # Fails unless the submission above was accepted.
          xcrun stapler staple dist/Recall-universal.dmg

      # Tauri only warns when it skips notarization, so prove the result on the file that
      # ships: Gatekeeper accepts the disk image, and the app inside it (Tauri deletes its
      # own copy of the .app once the .dmg is built) is validly signed, stapled and allowed
      # to launch.
      - name: Verify the .dmg and the app inside it
        if: steps.signing.outputs.enabled == 'true'
        run: |
          dmg=dist/Recall-universal.dmg
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$app" || { echo "no .app inside the .dmg"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Remove the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recall-desktop-universal
          path: dist/Recall-universal.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Recall-universal.dmg

  # Push the cask bump to fredoliveira/homebrew-tap. Needs a TAP_PUSH_TOKEN secret
  # (fine-grained PAT with contents:write on the tap repo); skips quietly if unset.
  tap:
    name: Bump Homebrew cask
    needs: [desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recall-desktop-universal
          path: dist

      - name: Regenerate cask and push to the tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN secret not set; skipping tap bump"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 dist/Recall-universal.dmg | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/fredoliveira/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sh packaging/homebrew/generate.sh cask "$version" "$sha" \
            > tap/Casks/recall-desktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/recall-desktop.rb
          git commit -m "recall-desktop ${version}"
          # The CLI workflow may push its formula bump concurrently; rebase and retry.
          for _ in 1 2 3; do git push && break; git pull --rebase; done
