[package]
name = "recall-desktop-gpui"
description = "Recall desktop - GPUI spike of the app in crates/desktop"
version = "0.3.1"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "recall-gpui"
path = "src/main.rs"

[dependencies]
# gpui-kit pins the matching GPUI snapshot (gpui-pre), so the two never drift apart.
gpui-kit = "=0.9.0"
smol = "2"
# `std` provides `set_boxed_logger` for the window's log sink.
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
serde_json = "1"
# The shared core: follower, config, paths and services, unchanged.
recall-core = { path = "../core" }
# The menu-bar icon. GPUI has no status-item API of its own.
tray-icon = "0.26"
