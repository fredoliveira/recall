# Virtual workspace: the `recall` CLI (`crates/cli`) on the wire-compatible core (`crates/core`).
#
# The desktop app (`crates/desktop`, GPUI) shares the core but is its own workspace, with its own
# lockfile: it pins a newer toolchain (see its rust-toolchain.toml) and brings several hundred
# crates the CLI never builds. Build it from its directory or with the `just desktop-*` recipes.
[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
exclude = ["crates/desktop"]

# Metadata shared by all workspace crates (each crate inherits with `field.workspace = true`).
[workspace.package]
version = "0.3.1"
license = "MIT"
repository = "https://github.com/fredoliveira/recall"
authors = ["Fred Oliveira <hi@helloform.com>"]
# Let-chains (edition 2024) need 1.88; CI checks this toolchain.
rust-version = "1.88"

# Shipped binaries: whole-program optimization and no symbols - smaller and a little faster,
# at the cost of a slower release build.
[profile.release]
lto = true
codegen-units = 1
strip = true
