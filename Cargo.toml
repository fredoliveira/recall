# Virtual workspace. Two shipped artifacts - the `recall` CLI (`crates/cli`) and the
# Tauri desktop app (`crates/desktop`) - share the wire-compatible core (`crates/core`).
#
# `default-members` is the CLI + core only, so bare `cargo build/test/clippy` (and CI) skip the
# desktop crate, which needs a system webview toolkit (webkit2gtk on Linux). Build it explicitly
# with `-p recall-desktop` or via the desktop CI job.
[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/desktop"]
default-members = ["crates/core", "crates/cli"]

# Metadata shared by all workspace crates (each crate inherits with `field.workspace = true`).
[workspace.package]
version = "0.3.1"
license = "MIT"
repository = "https://github.com/fredoliveira/recall"
authors = ["Fred Oliveira <hi@helloform.com>"]
# Let-chains (edition 2024) need 1.88; CI checks this toolchain.
rust-version = "1.88"

# Shipped binaries: whole-program optimization and no symbols - smaller and a little faster,
# at the cost of a slower release build.
[profile.release]
lto = true
codegen-units = 1
strip = true
